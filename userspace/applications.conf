# Rules use: CLASS_OR_PRIORITY SELECTOR VALUE
# The first matching rule overrides environment markers and automatic detection.
# Classes: game, desktop, interactive, compute, background
# Priorities: high, normal, low, ignore
# Selectors: exe (absolute executable), comm (thread-group name), directory
# Values may contain spaces. Shell variables and wildcards are not expanded.
# Names refer to /proc/PID/comm and are limited to the kernel's 15-byte name.
# Wine executable paths identify the Linux Wine loader; use comm for .exe names.
#
# Examples must be adjusted to actual executable paths or process names.
# game comm ExampleGame.exe
# game exe /opt/native-game/bin/game
# game directory /home/example/Games
# compute comm python3
# compute exe /opt/ai/bin/inference-server
# interactive comm blender
# background comm ffmpeg
# ignore comm winecfg.exe
